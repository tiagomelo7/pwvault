[package]
name = "pwvault"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita" }
aes-gcm = "0.11.1"
argon2 = "0.6.0"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_6"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = "1.8"
